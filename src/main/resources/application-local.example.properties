# ==========================================================================
# Archivo de ejemplo para configurar perfil LOCAL (con MYSQL)
# Sirve para configurar application-local.properties para el entorno local
# ==========================================================================

# Nombre de la aplicación
spring.application.name=parchis-ia-tfg

# URL de la base de datos local
spring.datasource.url=jdbc:mysql://localhost:3306/parchis_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC

# Usuario y contraseña (variables de entorno en Eclipse)
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Driver JDBC
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate configurado para usar el "dialecto" MySQL8
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect

# Se actualiza para no perder nada al arrancar
spring.jpa.hibernate.ddl-auto=update

# Mostrar sentencias SQL en consola
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true